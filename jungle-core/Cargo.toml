[package]
name = "jungle-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
async-trait = "0.1.89"
bincode = "1.3"
blake3 = "1.8.4"
bytes = { version = "1.11.1", features = ["serde"] }
glam = "0.32.1"
itertools = "0.14.0"
jungle-macros = { version = "0.1.0", path = "../jungle-macros" }
quick-xml = { version = "0.39.2", features = ["async-tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.50.0", features = ["full"] }

[dev-dependencies]
bincode = "1.3"
trybuild = "1.0.112"
